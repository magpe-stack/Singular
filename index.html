<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Singular</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="logo.svg" alt="Singular Logo" class="logo-icon">
      <h1 class="brand-title">Singular</h1>
    </div>
    <button id="theme-toggle" class="btn-icon" aria-label="Alternar Tema" title="Alternar Tema">
      <svg id="theme-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <!-- Ícone dinâmico via JS -->
      </svg>
    </button>
  </header>

  <main class="container">
    <!-- Opções de Processamento -->
    <div class="controls-bar">
      <div class="mode-selector">
        <label><input type="radio" name="mode" value="lines" checked> Linhas</label>
        <label><input type="radio" name="mode" value="words"> Palavras</label>
        <label><input type="radio" name="mode" value="csv"> CSV</label>
        <label><input type="radio" name="mode" value="json"> JSON</label>
      </div>

      <div class="file-actions">
        <label for="file-input" class="btn-icon" title="Carregar arquivo TXT, CSV ou JSON" aria-label="Abrir Arquivo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </label>
        <input type="file" id="file-input" accept=".txt,.csv,.json" hidden>

        <button id="btn-clear" class="btn-icon" title="Limpar tudo" aria-label="Limpar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Áreas de Texto -->
    <div class="editor-grid">
      <div class="editor-box">
        <textarea id="input-text" placeholder="Cole seu conteúdo original aqui (Texto, CSV ou JSON)..."></textarea>
      </div>
      <div class="editor-box">
        <textarea id="output-text" readonly placeholder="Resultado sem duplicados..."></textarea>
      </div>
    </div>

    <!-- Estatísticas -->
    <div class="stats-bar" id="stats">
      <span>Entrada: 0</span> | <span>Únicos: 0</span> | <span>Removidos: 0</span>
    </div>

    <!-- Ações Inferiores -->
    <footer class="action-footer">
      <button id="btn-save-offline" class="btn-icon btn-action" title="Salvar Offline no Navegador" aria-label="Salvar Offline">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
      </button>

      <!-- Botão Copiar Principal (Mãozinha) -->
      <button id="btn-copy" class="btn-copy-main" title="Copiar Resultado Único" aria-label="Copiar resultado">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
          <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"/>
          <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
          <path d="M18 8a2 2 0 0 1 2 2v4a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
        </svg>
      </button>

      <button id="btn-export" class="btn-icon btn-action" title="Exportar para Arquivo" aria-label="Exportar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
